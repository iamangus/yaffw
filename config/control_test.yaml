database_url: "postgres://user:password@localhost:5432/yaffw_test?sslmode=disable"
port: "8097"
frontend_api_key: "test-key"

libraries:
  - name: "TestMovies"
    path: "/tmp/test-media/movies"
    type: "movie"
    metadata_provider: "nfo"
    scan_interval: "1m"
    watch_fs: false
    missing_grace_period: "never"

transcode:
  internal_token: "test-token"
  hls_segment_time: 2
  heartbeat_interval: 1
  status_check_interval: 2
  dead_worker_threshold: 2
  idle_timeout: 10
  completed_retention: 30
  manifest_timeout: 10
  max_restarts: 2
  parallel_ranges: 0
