version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yaffw
      POSTGRES_USER: yaffw
      POSTGRES_PASSWORD: yaffw_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaffw"]
      interval: 3s
      timeout: 3s
      retries: 10

  control-plane:
    build:
      context: .
      dockerfile: Dockerfile.control
    ports:
      - "8096:8096"
    environment:
      DATABASE_URL: "postgres://yaffw:yaffw_dev@postgres:5432/yaffw?sslmode=disable"
      SEGMENT_DIR: "/shared/segments"
      MEDIA_DIR: "/media"
      INTERNAL_TOKEN: "dev-token"
    volumes:
      - segments:/shared/segments:ro
      - ./media:/media:ro
    depends_on:
      postgres:
        condition: service_healthy

  compute-plane:
    build:
      context: .
      dockerfile: Dockerfile.compute
    deploy:
      replicas: 2
    environment:
      CONTROL_URL: "http://control-plane:8096"
      SEGMENT_DIR: "/shared/segments"
      INTERNAL_TOKEN: "dev-token"
    volumes:
      - segments:/shared/segments
      - ./media:/media:ro
    depends_on:
      control-plane:
        condition: service_started

volumes:
  pgdata:
  segments:
